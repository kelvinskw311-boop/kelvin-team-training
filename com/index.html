<script>
(function(){

window.COURSE={"id":"com","en":"Communication, conflict and personal leadership","zh":"沟通、冲突解决与个人领导力","intro":["Six short units about working with people. You learn to listen actively, say what you mean clearly, understand your conflict style, resolve a conflict step by step, read people through behaviour rather than labels, and build your own leadership habits. The content follows public frameworks (active listening, the Thomas-Kilmann conflict modes and the SBI model). Personality labels are not used to judge people: you describe behaviour, ask questions and check your guesses.","关于与人共事的 6 个短单元：主动聆听、清楚表达、了解自己的冲突风格、一步一步化解冲突、通过行为而不是标签去了解人，以及建立个人领导习惯。内容依据公开框架（主动聆听、Thomas-Kilmann 冲突模式、SBI 模型）。我们不用性格标签来评判人：只描述行为、提问并检验自己的猜测。"],"units":[{"id":"c1","en":"Active listening","zh":"主动聆听","lesson":["Active listening means listening to understand, not to reply. Give your full attention, put the phone away, and look at the person. Ask open questions to learn more, paraphrase what you heard to check it (So you are saying that...), and hold back your judgement and your solution until they finish. Notice feelings as well as facts. Silence is allowed. Close the loop by summarising and agreeing the next step. Listening matters most when you disagree, because it lowers the heat and shows respect.","主动聆听是为了理解而听，不是为了回应而听。全神贯注，收起手机，看着对方。用开放性问题了解更多，用自己的话复述来确认（你的意思是……），在对方说完之前先不评判也不急着给解法。除了事实，也留意感受。允许沉默。最后总结并约定下一步。意见不同时聆听最重要，因为它能降温，也表示尊重。"],"example":["Staff: This roster is unfair, I always get weekends. You: So you feel the weekends are not shared fairly, is that right? What would a fair pattern look like to you? You then check the roster history together before deciding.","员工：这份排班不公平，我总是排周末。你：所以你觉得周末没有公平分配，对吗？在你看来公平的安排是怎样？然后你们一起查看排班记录再做决定。"],"sc":{"q":["An RM tells you, in a frustrated tone, that head office keeps changing targets. You already know the reason. What do you do?","一位 RM 语气沮丧地说总部一直改目标。你其实知道原因。你怎么做？"],"o":[{"t":["Say everyone has the same problem","说大家都一样"],"ok":0,"w":["It dismisses the feeling.","等于否定对方的感受。"]},{"t":["Explain the reason immediately","马上解释原因"],"ok":0,"w":["It sounds like defending and the RM feels unheard.","听起来像在辩护，RM 会觉得没被听见。"]},{"t":["Let the RM finish, paraphrase the frustration, ask what impact it has on the store, then share what you know","让 RM 说完，复述他的沮丧，问对门店的影响，再说你知道的"],"ok":1,"w":["Understanding first makes the explanation easier to accept.","先理解，解释才更容易被接受。"]}]},"quiz":[{"q":["What is the goal of active listening?","主动聆听的目标是什么？"],"o":[["To understand","为了理解"],["To reply quickly","为了快速回应"],["To win","为了赢"]],"a":0,"w":["Listen to understand.","为理解而听。"]},{"q":["What does paraphrasing do?","复述有什么作用？"],"o":[["Ends the talk","结束谈话"],["Checks you understood","确认你理解对了"],["Shows you are bored","显示你无聊"]],"a":1,"w":["Say it in your own words.","用自己的话说出来。"]},{"q":["Which is an open question?","哪个是开放性问题？"],"o":[["Was it bad?","很糟吗？"],["Did you do it?","你做了吗？"],["What happened next?","接下来发生了什么？"]],"a":2,"w":["Open questions invite detail.","开放性问题引出细节。"]},{"q":["When should you give your solution?","什么时候给你的解法？"],"o":[["After they finish and you understand","对方说完且你理解之后"],["Immediately","马上"],["Never","永远不"]],"a":0,"w":["Hold your solution back first.","先别急着给解法。"]},{"q":["Besides facts, what should you notice?","除了事实，还要留意什么？"],"o":[["Time","时间"],["Feelings","感受"],["Clothes","穿着"]],"a":1,"w":["Feelings drive behaviour.","感受推动行为。"]}],"task":["In three conversations today, paraphrase before you reply. Write one moment where paraphrasing changed what you first thought the person meant.","今天在三次谈话中，回应前先复述。写下一次因为复述而改变了你原先对对方意思判断的时刻。"],"src":[["Asana: active listening","https://asana.com/resources/active-listening"],["Slack: eight active listening strategies","https://slack.com/blog/collaboration/active-listening"],["Lumen Learning: listening (business communication)","https://courses.lumenlearning.com/wm-businesscommunicationmgrs/chapter/listening/"]]},
{"id":"c2","en":"Saying it clearly and respectfully","zh":"清楚而尊重地表达","lesson":["Clear messages are specific, short and respectful. Start with the purpose, state the fact, say what you need, and ask for a response. A useful structure is: When [fact], I feel or the effect is [impact], and I need [request]. Use I statements instead of you statements, avoid always and never, and separate the person from the problem. Match the channel to the message: simple information in writing, anything sensitive in person. After you speak, check what the other person heard. Assertive means clear and kind, not aggressive and not silent.","清楚的信息要具体、简短且尊重。先说目的，陈述事实，说出你需要什么，并请对方回应。好用的结构：当[事实]时，影响是[影响]，我需要[请求]。多用我的陈述，少用你的指责，避免总是和从不，把人和问题分开。渠道要配合内容：简单信息用文字，敏感的事当面谈。说完后确认对方听到了什么。果断是清楚而友善，不是攻击，也不是沉默。"],"example":["Instead of You never tell me when you swap shifts, say: When shift swaps are not told to me before they happen, I cannot cover the gaps. Please message me by 6pm the day before. Can you do that?","不要说你从来都不告诉我换班，而是说：当换班没在事前告知我时，我无法补缺口。请在前一天晚上 6 点前传信息给我。你可以吗？"],"sc":{"q":["A colleague keeps sending you incomplete stock counts. You are annoyed. What message is best?","同事一直给你不完整的盘点数字。你很生气。哪种信息最好？"],"o":[{"t":["You are so careless, you never do it properly.","你太粗心了，从来都做不好。"],"ok":0,"w":["It attacks the person and invites defence.","攻击人，会引起防卫。"]},{"t":["The last two counts were missing the freezer. That makes the food cost wrong. Please add the freezer and send by 9pm. Does that work?","最近两次盘点都漏了冰柜，导致食材成本不准。请把冰柜加进去，晚上 9 点前发给我。可以吗？"],"ok":1,"w":["Specific fact, impact, request and a check.","具体的事实、影响、请求，并确认对方回应。"]},{"t":["Say nothing and fix it yourself","什么都不说自己改"],"ok":0,"w":["The problem repeats and you build resentment.","问题会重复，你也会累积怨气。"]}]},"quiz":[{"q":["Which is an I statement?","哪个是我的陈述？"],"o":[["Everyone thinks you are wrong","大家都觉得你错"],["I need the count by 9pm","我需要 9 点前拿到盘点数字"],["You are always late","你总是迟"]],"a":1,"w":["Speak for yourself and about the need.","说自己的需要。"]},{"q":["Which words should you avoid?","应避免哪些词？"],"o":[["Please","请"],["Thank you","谢谢"],["Always and never","总是和从不"]],"a":2,"w":["They sound like attacks.","听起来像攻击。"]},{"q":["What does assertive mean?","果断是什么意思？"],"o":[["Clear and respectful","清楚而尊重"],["Loud","大声"],["Silent","沉默"]],"a":0,"w":["Not aggressive, not passive.","不攻击也不被动。"]},{"q":["Which channel for a sensitive topic?","敏感话题用哪个渠道？"],"o":[["Notice board","公告栏"],["In person","当面"],["Group chat","群组聊天"]],"a":1,"w":["Tone is easier to manage in person.","当面更容易掌握语气。"]},{"q":["Why check what the other person heard?","为什么要确认对方听到什么？"],"o":[["To test them","为了测试对方"],["Not needed","不需要"],["Messages get changed in the listening","信息在听的过程中会走样"]],"a":2,"w":["Intent and impact can differ.","意图与影响可能不同。"]}],"task":["Rewrite one message you recently sent that could have been clearer: purpose, fact, request, deadline. Send the new version and write how the person responded.","把你最近发出的一条可以更清楚的信息重写：目的、事实、请求、期限。发送新版本，并写下对方的反应。"],"src":[["CCL: use SBI to understand intent","https://www.ccl.org/blog/feedback-you-can-fathom/"],["Slack: eight active listening strategies","https://slack.com/blog/collaboration/active-listening"]]},
{"id":"c3","en":"Your conflict style","zh":"认识你的冲突风格","lesson":["The Thomas-Kilmann model describes five ways people handle conflict, along two dimensions: how much they push for their own concerns (assertiveness) and how much they care about the other side (cooperativeness). Competing: win your point. Collaborating: find a solution that satisfies both. Compromising: each gives a little. Accommodating: give way. Avoiding: step away. None is always right. Competing fits an emergency or safety call, collaborating fits important issues with time, compromising fits time pressure, accommodating fits small issues that matter more to the other person, avoiding fits trivial issues or a cooling-off moment. Most people have a habit, so learn yours and choose on purpose.","Thomas-Kilmann 模型把人们处理冲突的方式分成五种，沿两个维度：多想争取自己的诉求（果断度）以及多在乎对方（合作度）。竞争：要赢你的主张。合作：找出让双方都满意的方案。妥协：各让一步。迁就：让步。回避：走开。没有哪一种永远对。竞争适合紧急或安全决定，合作适合有时间的重要议题，妥协适合时间紧迫，迁就适合对方更在乎的小事，回避适合琐事或需要冷静的时刻。多数人都有习惯，先认识自己的习惯，再有意识地选择。"],"example":["Two leaders disagree on bake times. A competing leader insists on his own. A collaborating leader asks about sell-out data and waste, finds that a mid-afternoon wave solves both, and both agree.","两位主管对烘焙时间看法不同。竞争型的坚持自己的。合作型的则询问售罄与损耗数据，发现下午中段加一批能同时解决两边的问题，双方都同意。"],"sc":{"q":["Two staff both want the same Saturday off. The roster is already tight, and you have ten minutes before opening. Which mode fits best?","两位员工都想要同一个周六休息。排班本来就紧，开店前你只有十分钟。哪种模式最合适？"],"o":[{"t":["Compromising: a quick fair trade, such as one gets this Saturday and the other gets the next, written down","妥协：快速公平的交换，例如一人这周六、另一人下周六，并写下来"],"ok":1,"w":["Time is short, so a fair compromise fits. Collaborate later on the longer-term pattern.","时间紧，公平的妥协最合适。长期的安排再用合作方式处理。"]},{"t":["Competing: you decide with no explanation","竞争：你说了算，不解释"],"ok":0,"w":["It works fast but harms trust when overused.","快，但过度使用会伤害信任。"]},{"t":["Avoiding: ignore it","回避：不理会"],"ok":0,"w":["The roster still has to be done and the staff will feel ignored.","排班还是得做，员工会觉得被忽视。"]}]},"quiz":[{"q":["How many conflict modes are there in the model?","这个模型有几种冲突模式？"],"o":[["Three","三种"],["Ten","十种"],["Five","五种"]],"a":2,"w":["Competing, collaborating, compromising, accommodating, avoiding.","竞争、合作、妥协、迁就、回避。"]},{"q":["Which two dimensions define the modes?","哪两个维度决定模式？"],"o":[["Assertiveness and cooperativeness","果断度与合作度"],["Age and rank","年龄与职级"],["Speed and cost","速度与成本"]],"a":0,"w":["Own concerns and the other side concerns.","自己的诉求与对方的诉求。"]},{"q":["Which mode fits a safety emergency?","哪种模式适合安全紧急事件？"],"o":[["Accommodating","迁就"],["Competing (decide firmly)","竞争（坚定决定）"],["Avoiding","回避"]],"a":1,"w":["Safety calls need a quick firm decision.","安全问题要快速坚定地决定。"]},{"q":["Which mode seeks a win-win?","哪种模式追求双赢？"],"o":[["Avoiding","回避"],["Competing","竞争"],["Collaborating","合作"]],"a":2,"w":["Both concerns fully met.","双方诉求都充分满足。"]},{"q":["Is one mode always best?","有一种模式永远最好吗？"],"o":[["No, choose to fit the situation","没有，要看情境选择"],["Yes, collaborating","有，合作"],["Yes, competing","有，竞争"]],"a":0,"w":["All five have uses.","五种都有用处。"]}],"task":["Recall three recent conflicts. For each, write the mode you used, whether it fit, and what you would choose now. Note which mode you overuse.","回想最近三次冲突。每次写下你用的模式、是否合适，以及现在会选哪一种。写出你过度使用的一种。"],"src":[["MIT: the five conflict styles (Thomas-Kilmann)","https://web.mit.edu/collaboration/mainsite/modules/module1/1.11.5.html"],["USGS: Thomas-Kilmann Conflict Mode Instrument","https://www.usgs.gov/about/organization/science-support/human-capital/thomas-kilmann-conflict-mode-instrument-tki"],["Wageningen: conflict styles tool","https://edepot.wur.nl/690893"]]},
{"id":"c4","en":"Resolving a conflict step by step","zh":"一步一步化解冲突","lesson":["Use a simple path. 1 Cool down: pick a private place and a calm time. 2 Listen: let each person describe the situation, then paraphrase. 3 Separate facts, feelings and interpretations. 4 Find the needs behind the positions, because a position is what someone demands and a need is why. 5 Generate options together. 6 Agree on one option with an owner and a date. 7 Follow up. If emotions are too high, pause and return. If the issue is policy, safety or harassment, involve your manager or HR according to the company process: it is not for you to settle alone.","用一条简单的路径。1 降温：选私下的地点和平静的时间。2 聆听：让各方描述情况，并复述。3 区分事实、感受和解读。4 找出立场背后的需要：立场是对方要求什么，需要是为什么。5 一起想出选项。6 选定一个方案，并明确负责人与日期。7 跟进。情绪太高就暂停再回来。若涉及政策、安全或骚扰，要依公司程序通知经理或人力资源：不是你一个人能决定的。"],"example":["BOH says FOH over-orders cream cakes. FOH says BOH under-bakes. Facts: sold-out time 3pm on weekends. Needs: BOH wants less waste, FOH wants a full display. Option: add a 2pm weekend wave. Owner: BOH Lead, review in two weeks.","BOH 说 FOH 订太多奶油蛋糕，FOH 说 BOH 烤太少。事实：周末下午 3 点售罄。需要：BOH 要少损耗，FOH 要陈列饱满。选项：周末加一批 2 点的。负责人：BOH Lead，两周后检讨。"],"sc":{"q":["Two team members argue loudly at the counter in front of customers. What first?","两位同事在柜台当着顾客大声争吵。首先做什么？"],"o":[{"t":["Ask the customers to take sides","叫顾客评理"],"ok":0,"w":["It pulls customers into a staff issue.","把顾客拉进内部问题。"]},{"t":["Let them finish, they need to vent","让他们吵完，需要发泄"],"ok":0,"w":["Customers are watching and the quarrel can escalate.","顾客在看，争吵可能升级。"]},{"t":["Calmly separate them, take each aside, and set a time to talk after the shift","冷静地把两人分开，分别带开，并约定下班后谈"],"ok":1,"w":["Cool down first, then use the steps in private.","先降温，再私下用这些步骤。"]}]},"quiz":[{"q":["What is the first step?","第一步是什么？"],"o":[["Cool down in a private place","在私下的地点降温"],["Decide who is right","判断谁对谁错"],["Send an email to all","发邮件给大家"]],"a":0,"w":["Calm and private.","平静且私下。"]},{"q":["What is the difference between position and need?","立场和需要有什么区别？"],"o":[["Position is a job title","立场是职称"],["Position is what they demand, need is why","立场是要求什么，需要是为什么"],["No difference","没有区别"]],"a":1,"w":["Solve the need, not only the position.","解决需要，而不只是立场。"]},{"q":["What should you separate?","要区分什么？"],"o":[["Men and women","男女"],["Old and new staff","新旧员工"],["Facts, feelings, interpretations","事实、感受、解读"]],"a":2,"w":["Facts are the shared ground.","事实是共同基础。"]},{"q":["A conflict involves harassment. What do you do?","冲突涉及骚扰，你怎么做？"],"o":[["Follow the company process and involve HR or your manager","依公司程序，通知人力资源或经理"],["Settle it yourself quietly","自己悄悄解决"],["Ignore it","不理会"]],"a":0,"w":["Some issues are not yours to settle alone.","有些事不能自己一人处理。"]},{"q":["What ends the process?","流程最后是什么？"],"o":[["Silence","沉默"],["Agree an option with owner and date, then follow up","选定方案含负责人与日期，并跟进"],["A handshake","握手"]],"a":1,"w":["Follow-up keeps it solved.","跟进才能真正解决。"]}],"task":["Think of one unresolved tension in your team. Prepare using the seven steps: write the facts, each side needs, and two options. Hold the conversation and record the agreement.","想一件团队里还没解决的紧张关系。用七步准备：写下事实、双方的需要和两个选项。进行对话并记录约定。"],"src":[["MIT: the five conflict styles (Thomas-Kilmann)","https://web.mit.edu/collaboration/mainsite/modules/module1/1.11.5.html"],["CCL: use SBI to understand intent","https://www.ccl.org/blog/feedback-you-can-fathom/"]]},
{"id":"c5","en":"Understanding people: behaviour, not labels","zh":"了解人：看行为，不贴标签","lesson":["To understand someone, separate what you observe from what you conclude. Observation: she arrived at 8:20 three times and looked away when asked. Interpretation: she does not care. The interpretation is only one guess. Ask: what else could explain it? Then check by asking, because the only way to know intent is to ask. Look at patterns over time, at context (workload, health, family, unclear instructions), and at what the person needs to do well: clarity, skill, motivation, resources. Do not use personality labels or stereotypes to judge or decide about a person. They reduce people to a box and make you miss what is actually happening. Treat everyone with the same standard and respect, and keep what people tell you in confidence.","要了解一个人，先区分你观察到的和你推断的。观察：她三次 8:20 才到，被问到时目光回避。解读：她不在乎。这个解读只是一种猜测。问问自己：还有什么可能？然后用提问来验证，因为要知道意图只能问。看一段时间的规律，看背景（工作量、健康、家庭、指示不清），也看这个人要做好需要什么：清晰度、技能、动力、资源。不要用性格标签或刻板印象来评判或决定一个人，它们把人塞进盒子里，让你看不见真正发生的事。以同一标准和尊重对待每个人，并为对方保密。"],"example":["Observation: Ahmad has been quiet in huddles for two weeks. Possible reasons: unclear instructions, a skill gap, tiredness, a personal matter, a conflict with a colleague. You ask privately: I have noticed you have been quiet in huddles. How are things going for you?","观察：Ahmad 两周来在晨会都很安静。可能原因：指示不清、技能不足、疲倦、私人原因、与同事有冲突。你私下问：我注意到你最近晨会比较安静，你最近怎么样？"],"sc":{"q":["A leader says: She is just the lazy type, no point training her. What is the better response?","一位主管说：她就是懒的那种人，没必要培训。更好的回应是什么？"],"o":[{"t":["Agree, and stop investing in her","同意，不再投入"],"ok":0,"w":["A label replaces understanding and closes off improvement.","标签取代了理解，也断了改善的路。"]},{"t":["Ask what the leader actually saw, what else could explain it, and what she needs: clarity, skill, motivation or resources","问主管实际看到什么、还有什么可能、她需要什么：清晰度、技能、动力还是资源"],"ok":1,"w":["Describe behaviour, test the guess, find the need.","描述行为，检验猜测，找出需要。"]},{"t":["Move her to another store","把她调去别间店"],"ok":0,"w":["It does not address the cause and passes the problem on.","没有处理原因，只是把问题转走。"]}]},"quiz":[{"q":["Which is an observation?","哪个是观察？"],"o":[["He does not care","他不在乎"],["He was late three times this week","他本周迟到三次"],["He is irresponsible","他不负责任"]],"a":1,"w":["Observations can be counted or seen.","观察是看得见、数得出的。"]},{"q":["What is a good next step after forming a guess?","形成猜测后，好的下一步是什么？"],"o":[["Treat it as true","当作事实"],["Tell others","告诉别人"],["Check it by asking","用提问去验证"]],"a":2,"w":["Intent can only be known by asking.","意图只能靠问才知道。"]},{"q":["What four things might a person need to do well?","一个人做好工作可能需要哪四样？"],"o":[["Clarity, skill, motivation, resources","清晰度、技能、动力、资源"],["Luck, speed, size, age","运气、速度、体型、年龄"],["Rank, pay, title, desk","职级、薪水、职称、桌子"]],"a":0,"w":["Find which one is missing.","找出缺了哪一样。"]},{"q":["Why avoid personality labels for decisions?","为什么不用性格标签做决定？"],"o":[["They are expensive","太贵"],["They oversimplify and can be wrong or unfair","过度简化，可能错或不公平"],["They are illegal","违法"]],"a":1,"w":["Behaviour and facts are a fairer basis.","行为与事实才是更公平的依据。"]},{"q":["What should you do with private matters people share?","对别人告诉你的私事怎么做？"],"o":[["Share with the team","告诉团队"],["Post them","公开"],["Keep them in confidence","保密"]],"a":2,"w":["Trust is the base of leadership.","信任是领导力的基础。"]}],"task":["Pick one team member you find hard to read. Write three observations, three other explanations, and one question you will ask. Ask it and write what you learned.","选一位你觉得难以了解的团队成员。写下三项观察、三种其他可能的解释，以及一个你要问的问题。去问并写下你学到什么。"],"src":[["CCL: use SBI to understand intent","https://www.ccl.org/blog/feedback-you-can-fathom/"],["Asana: active listening","https://asana.com/resources/active-listening"]]},
{"id":"c6","en":"Personal leadership habits","zh":"个人领导力习惯","lesson":["Personal leadership starts with how you lead yourself. Four habits make the biggest difference. Self-awareness: notice your reactions, your triggers and your conflict habit, and ask for feedback often. Consistency: do what you say, the same way on a good day and a bad day. Ownership: admit your mistakes, fix them and share what you learned. Energy and focus: protect sleep and breaks, choose the two or three things that matter most each week, and say no to the rest. Add a short weekly reflection: what went well, what I would do differently, and one habit I will practise. People copy what leaders do more than what they say.","个人领导力从如何带领自己开始。四个习惯影响最大。自我觉察：留意自己的反应、触发点和冲突习惯，并常常征求反馈。言行一致：说到做到，好日子坏日子都一样。负责：承认错误、修正并分享学到的。精力与专注：保护睡眠和休息，每周选出最重要的两三件事，其余的学会说不。再加一个简短的每周反思：什么做得好、什么我会不同地做、我要练习哪一个习惯。人们学的是领导做的，多过领导说的。"],"example":["Friday reflection, five minutes: Went well: the huddle stayed on time all week. Do differently: I interrupted my AC twice. Habit for next week: count to three before I reply. Ask my AC on Friday if it helped.","周五反思，五分钟：做得好：晨会整周都准时。会不同地做：我打断了 AC 两次。下周的习惯：回应前先数到三。周五问 AC 有没有帮助。"],"sc":{"q":["You promised the team a roster change by Friday and you forgot. A crew member brings it up. What is the best response?","你答应团队周五前改好排班，却忘了。一位员工提起这件事。最好的回应是什么？"],"o":[{"t":["Admit it, apologise briefly, give a new date and keep it","承认、简短道歉、给出新日期并做到"],"ok":1,"w":["Ownership and consistency rebuild trust.","负责和言行一致重建信任。"]},{"t":["Hope nobody remembers","希望没人记得"],"ok":0,"w":["People remember, and trust falls.","人们会记得，信任就下降。"]},{"t":["Explain you were too busy","解释你太忙了"],"ok":0,"w":["Excuses weaken trust.","借口削弱信任。"]}]},"quiz":[{"q":["What is self-awareness?","什么是自我觉察？"],"o":[["Being shy","害羞"],["Being perfect","完美"],["Noticing your own reactions and habits","留意自己的反应与习惯"]],"a":2,"w":["Knowing yourself lets you choose.","了解自己才能选择。"]},{"q":["What does consistency mean?","言行一致是什么意思？"],"o":[["Do what you say, the same on good and bad days","说到做到，好坏日子一样"],["Never change","永不改变"],["Be strict","严厉"]],"a":0,"w":["Reliable leaders earn trust.","可靠的领导赢得信任。"]},{"q":["After a mistake, what should a leader do?","犯错后，领导应该做什么？"],"o":[["Blame the team","怪团队"],["Admit, fix and share the learning","承认、修正并分享学到的"],["Hide it","隐瞒"]],"a":1,"w":["Ownership shows by example.","以身作则示范负责。"]},{"q":["How many top priorities per week is a good aim?","每周的首要事项多少个比较好？"],"o":[["Twenty","二十个"],["None","没有"],["Two or three","两三个"]],"a":2,"w":["Focus beats a long list.","专注胜过长清单。"]},{"q":["What is a weekly reflection for?","每周反思的目的是什么？"],"o":[["Learn and choose one habit to practise","学习并选一个要练习的习惯"],["Blame yourself","责怪自己"],["Impress others","给别人印象"]],"a":0,"w":["Small repeated change.","小而重复的改变。"]}],"task":["For four weeks, do a five-minute Friday reflection: went well, do differently, one habit. After the fourth week, ask one team member what changed that they noticed.","连续四周每个周五做五分钟反思：做得好、会不同地做、一个习惯。第四周后，问一位团队成员他注意到什么改变。"],"src":[]}]};
