<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance and profit — Kelvin Team Training 财务与利润</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#3b2a1e;--mute:#7a6757;--line:#eadfce;--crust:#b5651d;--crust-bg:#f7e7d3;--leaf:#4f7a3a;--leaf-bg:#e6f0dc;--red:#a8341f;--red-bg:#f8e1db;--sky:#2c6a8f;--sky-bg:#dcebf4;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.65;font-size:16px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:15px;margin:4px 8px 2px;font-weight:600}
aside .sub{font-size:12px;color:var(--mute);margin:0 8px 12px}
.nv{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;line-height:1.35}
.nv:hover{background:var(--bg)}
.nv.on{background:var(--crust-bg);color:#7a3f0c;font-weight:600}
.nv .n{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--mute);margin-top:1px}
.nv.done .n{background:var(--leaf);border-color:var(--leaf);color:#fff}
.nv .t small{display:block;color:var(--mute);font-weight:400}
.nv.on .t small{color:#8a5a2c}
main{padding:20px 28px 60px;max-width:900px;width:100%;min-width:0}
.top{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.bar{flex:1;min-width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--crust);width:0;transition:width .3s}
.pc{font-size:12px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.menu{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--crust);font-weight:600;margin:0}
h2.title{font-size:26px;line-height:1.25;margin:2px 0 14px;font-weight:700}
h2.title .zh{font-size:22px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.03em;color:var(--mute);font-weight:600}
.card p{margin:0}
.card .zh{color:#5b4838}
.en,.zh{display:block}
.en,.zh{display:block}
body.lang-en .zh{display:none}
body.lang-zh .en{display:none}
.inl .en,.inl .zh{display:inline}
.inl .en+.zh::before{content:" / "}
.lang-en .inl .en+.zh::before,.lang-zh .inl .en+.zh::before{content:""}
.ill{padding:10px 12px}
.ill svg{width:100%;height:auto;display:block}
.ill .cap{font-size:12px;color:var(--mute);margin-top:4px}
.ex{background:var(--crust-bg);border-color:#efd3b0}
.ex .big{font-size:18px;font-weight:600;color:#6e3a0a}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn:hover{opacity:.9}
.ans{display:none;margin-top:10px;background:var(--leaf-bg);border-radius:10px;padding:10px 14px;color:#2f4f20}
.ans.show{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid .card{margin:0}
.f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0 2px;display:block}
.warn{background:var(--red-bg);border-color:#e9bcb2;color:#6b2214}
.note{font-size:13px;color:var(--mute)}
.why{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink)}
.why h4{margin:0 0 4px;font-size:12px;letter-spacing:.03em;color:var(--mute)}
.why p{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.sl{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.sl input{width:100%;accent-color:var(--crust)}
.sl output{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.kpi div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pos{color:var(--leaf)}.neg{color:var(--red)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tl .card{border-top:4px solid var(--crust);margin:0}
.tl .card:nth-child(2){border-top-color:var(--sky)}.tl .card:nth-child(3){border-top-color:var(--leaf)}
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;background:var(--card)}
.q input[type=text],.q textarea,.ws input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.q input[type=text]{max-width:200px}
.err{color:var(--red);font-size:13px;margin-top:6px;display:none}
.res{margin-top:8px;font-size:14px;display:none;border-radius:8px;padding:8px 12px}
.res.ok{display:block;background:var(--leaf-bg);color:#2f4f20}
.res.no{display:block;background:var(--red-bg);color:#6b2214}
.ws label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--crust-bg);color:#6e3a0a;border-radius:999px;padding:3px 12px;font-size:13px}
.addnote{background:var(--sky-bg);border-color:#bcd7e8;color:#1d4a66;font-size:13px}
.hr{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.hr label{display:block;font-size:12px;color:var(--mute)}
.hr6{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.hr6>div{display:flex;flex-direction:column}
.hr6 label{flex:1;display:block;line-height:1.3;margin-bottom:4px}
.hr input,.num{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff;color:var(--ink)}
@media (max-width:820px){
 .hr6{grid-template-columns:repeat(3,minmax(0,1fr))}
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
 aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
 .menu{display:block}
 main{padding:14px 14px 50px}
 .sl{grid-template-columns:1fr 70px}.sl input{grid-column:1/3;order:3}
}
</style>
</head>
<body class="lang-both">
<div class="app">
<aside id="side"></aside>
<main>
 <div class="top">
  <button class="menu" id="menu" aria-label="Menu">Menu 目录</button>
  <div class="bar"><i id="barfill"></i></div>
  <span class="pc" id="pc"></span>
  <div class="seg" role="group" aria-label="Language">
   <button data-l="both" class="on">EN + 中</button><button data-l="en">EN</button><button data-l="zh">中</button>
  </div>
 </div>
 <div id="view"></div>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
