(function(){

window.COURSE={"id":"led","en":"Leadership: coaching, feedback, 1:1 and reporting","zh":"领导力：辅导、反馈、1:1 与汇报","intro":["Six short units for people who lead others. You learn to coach with the GROW questions, give feedback with the SBI structure, run a 1:1 or shareback, report up with facts, delegate with clear ownership, and coach on the job. The coaching and feedback units follow public models (GROW and the Center for Creative Leadership SBI model). Reporting, delegation and on-the-job coaching are common management practice. Adapt the wording to your company standards.","给带领他人者的 6 个短单元：用 GROW 提问做辅导、用 SBI 结构给反馈、主持 1:1 或 shareback、用事实向上汇报、清楚授权，以及在岗辅导。辅导和反馈单元依据公开模型（GROW 与创意领导力中心 CCL 的 SBI 模型）；汇报、授权和在岗辅导是常见的管理做法。请按公司标准调整用语。"],"units":[{"id":"l1","en":"Coaching with the GROW model","zh":"用 GROW 模型做辅导","lesson":["Coaching means helping a person find their own answer instead of telling them. GROW gives four steps, each led by questions. Goal: what do you want to achieve? Reality: what is happening now, and what have you tried? Options: what could you do, and what else? Will (way forward): which option will you take, by when, and what support do you need? Ask open questions, listen, and let the person talk more than you. Telling is still right in an emergency or when safety is at stake, but for development, questions build ownership.","辅导是帮助对方找到自己的答案，而不是直接告诉他。GROW 有四步，每一步用问题带领。目标（Goal）：你想达到什么？现状（Reality）：现在是什么情况，你试过什么？选项（Options）：你可以怎么做，还有吗？行动（Will / 前进的路）：你选哪一个，何时做，需要什么支持？多问开放性问题、认真聆听，让对方说得比你多。紧急或涉及安全时，直接告知仍然是对的；但在培养人时，提问更能建立责任感。"],"example":["Your AC says her team keeps missing the waste target. Goal: What would a good week look like? Reality: What did the waste log show this week? Options: What could you try, and what else? Will: Which one will you start tomorrow, and how will you check it by Friday?","你的 AC 说她的团队总是达不到损耗目标。目标：怎样的一周才算好？现状：这周损耗记录显示什么？选项：你可以试什么，还有吗？行动：明天开始哪一个，周五前怎么检查？"],"sc":{"q":["A leader sees an RM struggling with roster planning. The RM asks, What should I do? What is the better coaching response?","领导看到 RM 在排班上很吃力。RM 问：我该怎么做？更好的辅导回应是什么？"],"o":[{"t":["Say you are too busy to help","说太忙了没时间帮"],"ok":0,"w":["It cuts the learning chance and the relationship.","断送了学习机会，也伤害关系。"]},{"t":["Tell the RM exactly what roster to use","直接告诉 RM 要用哪种排班"],"ok":0,"w":["It solves today, but the RM does not learn and keeps asking.","解决了今天的问题，但 RM 没学到，下次还会问。"]},{"t":["Ask: what is your goal for the roster, what is happening now, what options do you see, and what will you try first?","问：你对排班的目标是什么、现在情况如何、你看到哪些选项、你先试哪一个？"],"ok":1,"w":["This follows GROW and builds the RM own thinking.","这符合 GROW，培养 RM 自己的思考。"]}]},"quiz":[{"q":["What does GROW stand for?","GROW 代表什么？"],"o":[["Goal, Reality, Options, Will","目标、现状、选项、行动"],["Grow, Reward, Observe, Win","成长、奖励、观察、赢"],["Goal, Review, Order, Work","目标、检讨、订货、工作"]],"a":0,"w":["Four steps led by questions.","四步，用问题带领。"]},{"q":["Which is a Reality question?","哪个是现状问题？"],"o":[["When will you start?","何时开始？"],["What is happening now and what have you tried?","现在情况如何，你试过什么？"],["What do you want to achieve?","你想达到什么？"]],"a":1,"w":["Reality explores the present.","现状是探讨当下。"]},{"q":["In coaching, who should talk more?","辅导时谁该多说？"],"o":[["The coach","辅导者"],["Equal always","永远一样多"],["The coachee","被辅导的人"]],"a":2,"w":["Questions let the person think and speak.","提问让对方思考并发言。"]},{"q":["When is telling better than coaching?","什么时候直接告知比辅导好？"],"o":[["Emergency or safety","紧急或安全问题"],["Always","永远"],["Never","永远不"]],"a":0,"w":["Safety cannot wait for a conversation.","安全问题不能等对话。"]},{"q":["What should the Will step end with?","行动这一步要以什么结束？"],"o":[["Nothing","什么都没有"],["A chosen action, a date, and support needed","选定的行动、日期和所需支持"],["A long list","一长串清单"]],"a":1,"w":["A commitment makes it real.","有承诺才会落实。"]}],"task":["Hold one 15-minute GROW conversation with a team member about one real issue. Write the goal, the option they chose and the date. Do not give advice unless asked.","与一位团队成员就一个真实议题做一次 15 分钟的 GROW 对话。写下目标、对方选的选项和日期。除非对方要求，否则不给建议。"],"src":[["Google re:Work: coach using the GROW model","https://rework.withgoogle.com/intl/en/guides/coach-using-the-grow-model"],["MindTools: the GROW model","https://www.mindtools.com/your-toolkit/coaching-goals/grow-model/"],["University of Cambridge: GROW model (people development)","https://www.ppd.admin.cam.ac.uk/files/people_development-grow_model.pdf"]]},
{"id":"l2","en":"Feedback with SBI","zh":"用 SBI 给反馈","lesson":["SBI, from the Center for Creative Leadership, keeps feedback specific and non-judgmental. Situation: say when and where. Behavior: describe what you saw or heard, not your opinion of the person. Impact: say the effect on the customer, the team or the result. CCL adds a second I, Intent: ask what the person meant, because the only way to know intent is to ask. Use SBI for praise as well as for correction, give it soon after the event, and in private for corrections.","SBI 来自创意领导力中心（CCL），让反馈具体且不带评判。情境（Situation）：说明何时何地。行为（Behavior）：描述你看到或听到的，而不是你对人的看法。影响（Impact）：说出对顾客、团队或结果的影响。CCL 还加了第二个 I：意图（Intent）：问对方原本想怎样，因为要知道意图只能问。表扬和纠正都可以用 SBI；要尽快给，纠正时私下进行。"],"example":["Situation: At today lunch peak. Behavior: I saw you leave the counter twice to restock while three customers were waiting. Impact: the queue reached six people and two left. Intent: What were you trying to do? Together agree what to do next time.","情境：今天午市高峰。行为：我看到你两次离开柜台去补货，当时有三位顾客在等。影响：队伍排到六个人，有两位离开了。意图：你当时想做什么？然后一起约定下次怎么做。"],"sc":{"q":["You want to give feedback to a crew member who is often late. Which opening follows SBI?","你要给常迟到的员工反馈。哪一种开头符合 SBI？"],"o":[{"t":["You are always lazy and careless.","你总是懒散又不负责。"],"ok":0,"w":["That is a judgment about the person, not a behavior.","这是对人的评判，不是行为。"]},{"t":["On Monday and Wednesday you clocked in at 8:20 for the 8:00 shift. The bake counter was not ready and the first customers waited. What happened?","周一和周三你 8:20 才打卡，班次是 8:00。柜台没准备好，第一批顾客在等。发生了什么事？"],"ok":1,"w":["It names the situation, the observable behavior and the impact, then asks about intent.","它说出情境、可观察的行为和影响，再询问意图。"]},{"t":["Others are complaining about you.","别人在抱怨你。"],"ok":0,"w":["It is vague hearsay and gives nothing to act on.","模糊的传闻，没有可行动的内容。"]}]},"quiz":[{"q":["What does SBI stand for?","SBI 代表什么？"],"o":[["Speak, Believe, Insist","说、相信、坚持"],["Situation, Behavior, Impact","情境、行为、影响"],["Sales, Budget, Income","销售、预算、收入"]],"a":1,"w":["Developed by CCL.","由 CCL 提出。"]},{"q":["Which is a behavior?","哪个是行为？"],"o":[["You are rude","你很无礼"],["You have a bad attitude","你态度不好"],["You raised your voice at the customer","你对顾客提高了音量"]],"a":2,"w":["Behavior is observable. The others are labels.","行为是可观察的，其他是标签。"]},{"q":["What does the second I in SBII mean?","SBII 的第二个 I 是什么？"],"o":[["Intent","意图"],["Instruction","指示"],["Insist","坚持"]],"a":0,"w":["Ask what they meant.","问对方原本的意图。"]},{"q":["Should SBI be used for praise too?","SBI 也可以用在表扬吗？"],"o":[["Only yearly","只限年度"],["Yes","可以"],["No","不可以"]],"a":1,"w":["Specific praise repeats good behavior.","具体的表扬能让好行为重复出现。"]},{"q":["Where should corrective feedback be given?","纠正性反馈该在哪里给？"],"o":[["Before the whole team","在全队面前"],["At the year-end review","年终检讨时"],["In private, soon after","私下并尽快"]],"a":2,"w":["Timely and private protects dignity.","及时又私下，能保护对方尊严。"]}],"task":["Give two SBI feedbacks this week: one positive, one corrective. Write the Situation, Behavior and Impact for each and what the person said about intent.","本周给两次 SBI 反馈：一次表扬、一次纠正。分别写下情境、行为、影响，以及对方对意图的回答。"],"src":[["CCL: use SBI to understand intent","https://www.ccl.org/blog/feedback-you-can-fathom/"],["University of Calgary: SBI model in one-on-one meetings","https://www.ucalgary.ca/hr/training-development/connect-perform/one-one-meetings/sbi-model"],["MindTools: the Situation-Behavior-Impact feedback tool","https://prime.mindtools.com/pages/article/situation-behavior-impact-feedback.htm"]]},
{"id":"l3","en":"Running a 1:1 or shareback","zh":"主持 1:1 与 shareback","lesson":["A 1:1 is the person meeting, not a status meeting. Keep a fixed time, and let the other person set much of the agenda. A simple structure: check in (how are you), their topics, results against their goals (numbers and facts), coaching with GROW, feedback with SBI, and agreed actions with owner and date. In a shareback, bring the data first, ask the person for their own read before you give yours, then agree the next step. Take short notes and start the next 1:1 by reviewing last time actions. For two-on-one sessions, agree beforehand who leads and who takes notes so the person does not feel outnumbered.","1:1 是以人为本的会面，不是进度汇报会。时间固定，让对方决定大部分议程。简单结构：开场关心、对方的议题、对照目标看结果（数字与事实）、用 GROW 辅导、用 SBI 反馈、约定行动（负责人与日期）。做 shareback 时先拿出数据，先问对方自己的看法再说你的，然后约定下一步。简短记录，下次 1:1 先检查上次的行动。两人对一人的面谈，事先约定谁主持、谁记录，避免对方觉得被围攻。"],"example":["A 45-minute shareback: 5 min check-in, 10 min results versus goals, 15 min discuss with GROW questions, 10 min feedback, 5 min agree three actions with owners and dates.","45 分钟的 shareback：5 分钟开场、10 分钟对照目标看结果、15 分钟用 GROW 提问讨论、10 分钟反馈、5 分钟约定三项行动（含负责人与日期）。"],"sc":{"q":["In the 1:1 your RM spends the first 20 minutes listing problems. You have a lot to say about the numbers. What do you do?","1:1 一开始 RM 花了 20 分钟列举问题。你对数字有很多话想说。你怎么做？"],"o":[{"t":["Listen, summarise what you heard, then ask which one problem matters most and use GROW to work on it","聆听并总结你听到的，再问哪个问题最重要，然后用 GROW 来处理"],"ok":1,"w":["It respects the person and moves to action on one issue.","尊重对方，并把重点放在一个问题上落实行动。"]},{"t":["Cancel the 1:1 because it is not useful","取消 1:1，因为没用"],"ok":0,"w":["Cancelling removes the one place where this can be fixed.","取消就失去了能解决问题的场合。"]},{"t":["Interrupt and give your solutions","打断并说出你的解法"],"ok":0,"w":["The RM stops thinking and starts waiting for instructions.","RM 不再思考，只等指示。"]}]},"quiz":[{"q":["What is the main purpose of a 1:1?","1:1 的主要目的是什么？"],"o":[["Check attendance","查勤"],["Read the report aloud","读报告"],["Develop the person and remove obstacles","培养人并扫除障碍"]],"a":2,"w":["It is the person meeting.","它是以人为本的会面。"]},{"q":["Who should set most of the agenda?","谁该决定大部分议程？"],"o":[["The other person","对方"],["The leader only","只有领导"],["Nobody","没人"]],"a":0,"w":["It gives ownership.","让对方有主人翁感。"]},{"q":["In a shareback, what comes first?","shareback 里先做什么？"],"o":[["List mistakes","列出错误"],["Show the data, ask for their read","拿出数据，问对方的看法"],["Give your conclusion","先给结论"]],"a":1,"w":["Facts first, their view before yours.","先事实，先听他的看法。"]},{"q":["How should the next 1:1 begin?","下一次 1:1 如何开始？"],"o":[["Start fresh with new topics","直接谈新议题"],["Skip to feedback","直接给反馈"],["Review last actions","检查上次的行动"]],"a":2,"w":["Follow-through builds trust.","跟进能建立信任。"]},{"q":["What helps in a two-on-one session?","两人对一人的面谈要注意什么？"],"o":[["Agree beforehand who leads and who notes","事先约定谁主持谁记录"],["Both talk at once","两人同时发言"],["Take no notes","不记录"]],"a":0,"w":["It avoids the person feeling outnumbered.","避免对方被围攻的感觉。"]}],"task":["Plan one 1:1 using the structure above. Send the person two topics you will cover and ask for theirs. After the meeting write the three agreed actions with owners and dates.","用上面的结构规划一次 1:1。事先把你要谈的两个议题发给对方，并请对方提出他的议题。会后写下三项约定行动，含负责人与日期。"],"src":[["University of Calgary: SBI model in one-on-one meetings","https://www.ucalgary.ca/hr/training-development/connect-perform/one-one-meetings/sbi-model"],["Google re:Work: coach using the GROW model","https://rework.withgoogle.com/intl/en/guides/coach-using-the-grow-model"]]},
{"id":"l4","en":"Reporting up: facts, cause, action","zh":"向上汇报：事实、原因、行动","lesson":["Your boss wants three things from a report: where we are, why, and what you will do. Lead with the answer, then give facts, cause, action, owner, deadline and expected impact. Compare actual to budget and last year, and explain both dollars and percentage points. Separate fact from opinion, say what you do not yet know, and bring one recommendation, not only problems. Bad news travels early: raise a risk when you see it, with a plan. Keep it to one page or five minutes. Be ready to show the numbers behind each claim.","上司要从汇报里知道三件事：现在在哪里、为什么、你要怎么做。先说结论，再给事实、原因、行动、负责人、期限和预期影响。对比实际、预算和去年，并同时解释金额与百分点。区分事实与意见，说清楚还不知道的部分，带上一个建议而不只是问题。坏消息要早说：看到风险就带着计划提出来。控制在一页或五分钟内，每个说法都要能拿出背后的数字。"],"example":["Headline: Store profit is $2,000 below budget this month. Fact: sales −4%, waste 7% against 5% limit. Cause: extra afternoon batches. Action: cut the 4pm batch, owner BOH Lead, from Monday. Impact: about $1,000 a month. Risk: sell-out at 5pm, so we will track it.","结论：本月门店利润比预算少 $2,000。事实：销售 −4%，损耗 7%，上限 5%。原因：下午多烤。行动：取消 4 点那批，负责人 BOH Lead，周一起执行。影响：每月约 $1,000。风险：5 点可能售罄，我们会追踪。"],"sc":{"q":["Your weekly report is due and the store missed target. You are tempted to start with the long explanation. What is better?","每周汇报到期，门店没达标。你很想从冗长的解释开始。更好的做法是什么？"],"o":[{"t":["Send the raw numbers and let them figure it out","只发原始数字让上司自己看"],"ok":0,"w":["Numbers without cause and action are not a report.","只有数字没有原因与行动，不算汇报。"]},{"t":["Explain every cause first so the boss is not upset","先把所有原因解释一遍，免得上司不高兴"],"ok":0,"w":["The boss has to dig for the point. Lead with the answer.","上司得自己挖重点。先说结论。"]},{"t":["Start with the result and gap, then the cause, the action, owner, deadline and expected impact","先说结果与差距，再说原因、行动、负责人、期限和预期影响"],"ok":1,"w":["It is clear, short and shows you own the fix.","清楚简短，也显示你负责解决。"]}]},"quiz":[{"q":["How should a report start?","汇报应怎样开始？"],"o":[["With the answer or main point","先说结论或重点"],["With the history","从背景讲起"],["With apologies","从道歉开始"]],"a":0,"w":["Lead with the answer.","先说结论。"]},{"q":["What is the report chain?","汇报链条是什么？"],"o":[["Sales, cost, profit","销售、成本、利润"],["Fact, cause, action, owner, deadline, impact","事实、原因、行动、负责人、期限、影响"],["Idea, hope, wish","想法、期待、愿望"]],"a":1,"w":["It makes the update usable.","让汇报可用。"]},{"q":["Sales fell from $100k to $92k. What is the change?","销售从 $100k 降到 $92k，变化是多少？"],"o":[["−8k%","−8k%"],["+8%","+8%"],["−8%","−8%"]],"a":2,"w":["(92 − 100) ÷ 100 = −8%.","(92 − 100) ÷ 100 = −8%。"]},{"q":["Why bring a recommendation?","为什么要带建议？"],"o":[["It shows ownership and speeds decisions","显示负责，加快决策"],["To avoid work","为了偷懒"],["It is optional style","只是风格"]],"a":0,"w":["Bring solutions, not only problems.","带解法，不只是问题。"]},{"q":["When should you raise a risk?","什么时候提出风险？"],"o":[["Never","永远不提"],["As soon as you see it, with a plan","一看到就提，并附上计划"],["After it happens","发生后"]],"a":1,"w":["Early warning gives options.","早提醒才有选择。"]}],"task":["Write your next weekly update in the chain format on one page. Mark each line as fact or opinion. Ask your boss afterwards what was missing.","用链条格式写下你下一次的每周汇报，一页为限，每一行标明是事实还是意见。事后问上司还缺了什么。"],"src":[]},
{"id":"l5","en":"Delegation and accountability","zh":"授权与责任落实","lesson":["Delegating means handing over a result, not only a task, and staying accountable for it. Before you delegate, choose the right person and be clear about five things: the outcome you want, the deadline, the measure of success, the limits of their authority, and when you will check in. Match the amount of control to the person skill and the risk. Give support, not interference: ask for their plan, agree check-in times, and resist taking the work back. When it goes wrong, ask what happened and what to change, then fix the system. Praise results publicly and credit the person.","授权是交出结果，而不只是任务，并且你仍对结果负责。授权前选对人，并说清楚五件事：想要的成果、期限、成功的衡量标准、对方的权限范围、何时检查进度。控制的程度要配合对方的能力和风险。给支持，不要干涉：请对方说出计划，约定检查时间，忍住不要把工作拿回来。出了问题，先问发生了什么、要怎么改，再修正制度。成果要公开肯定，并把功劳归给对方。"],"example":["Delegate to the BOH Lead: Outcome: cut waste from 7% to 5% in six weeks. Measure: weekly waste % in the log. Authority: change bake quantities within the plan, ask me for anything above $200. Check-in: every Friday for 10 minutes.","授权给 BOH Lead：成果：六周内把损耗从 7% 降到 5%。衡量：损耗记录里的每周损耗率。权限：在计划内调整烘焙数量，超过 $200 的先问我。检查：每周五 10 分钟。"],"sc":{"q":["You delegated the roster to your AC. On Tuesday you see a mistake and feel like taking it back. What is better?","你把排班授权给 AC。周二你看到一个错误，很想把工作拿回来。更好的做法是什么？"],"o":[{"t":["Take it back and fix it yourself","拿回来自己改"],"ok":0,"w":["The AC learns the work is never really theirs.","AC 会觉得这工作从来不属于自己。"]},{"t":["Ask the AC to walk you through the plan, point out the gap with SBI, and let the AC fix it","请 AC 讲解计划，用 SBI 指出问题，让 AC 自己修正"],"ok":1,"w":["You stay accountable, but the person keeps ownership and learns.","你仍然负责，但对方保有主权并从中学习。"]},{"t":["Say nothing and hope it works out","什么都不说，期待它自己好"],"ok":0,"w":["Delegating is not abandoning. You still check in.","授权不是放手不管，仍要检查。"]}]},"quiz":[{"q":["What do you hand over when you delegate?","授权时交出什么？"],"o":[["Your accountability","你的责任"],["A result and its authority","结果与相应的权限"],["Only a task","只有任务"]],"a":1,"w":["You remain accountable.","你仍然负责。"]},{"q":["Which is NOT one of the five things to make clear?","哪个不是要说清楚的五件事之一？"],"o":[["Outcome","成果"],["Deadline","期限"],["Who else can be blamed","还有谁可以被怪罪"]],"a":2,"w":["The five are outcome, deadline, measure, authority, check-in.","五件事：成果、期限、衡量、权限、检查。"]},{"q":["How much control should you keep?","应该保留多少控制？"],"o":[["Match skill and risk","配合能力与风险"],["Always full","永远完全"],["None","完全不要"]],"a":0,"w":["More support for newer people and higher risk.","新手和高风险的任务要多支持。"]},{"q":["When a delegated task goes wrong, what first?","授权的事出错，先做什么？"],"o":[["Take it back","拿回来"],["Ask what happened and what to change","问发生了什么、要怎么改"],["Blame","责怪"]],"a":1,"w":["Learn and fix the system.","学习并修正制度。"]},{"q":["Who gets the credit for a good result?","好成果的功劳归谁？"],"o":[["The leader only","只有领导"],["Nobody","没人"],["The person who did it","做的人"]],"a":2,"w":["Credit builds ownership.","肯定建立主人翁精神。"]}],"task":["Delegate one real task using the five clarity points. Write them down, share with the person, and check in at the agreed time. Note what you did not take back.","用五个明确点授权一件真实任务。写下来、与对方分享，并按约定时间检查。记下你忍住没有拿回来的部分。"],"src":[]},
{"id":"l6","en":"Coaching on the job (OJT)","zh":"在岗辅导（OJT）","lesson":["Training a new person on the job works best in four steps: Tell (explain why and how), Show (do it while they watch), Let them do it while you watch, and Review (give SBI feedback and agree the next step). Break the job into small parts, check understanding by asking them to explain it back, and record progress against a checklist so anyone can see what is done. Match support to readiness: a beginner needs clear instructions, an improving person needs coaching, a capable person needs trust. Keep food safety steps non-negotiable from day one.","在岗培训新人，四步最有效：讲（说明为什么与怎么做）、示范（边做边让他看）、让他做你在旁观察、检讨（用 SBI 给反馈并约定下一步）。把工作拆成小块，请对方复述来确认理解，并对照清单记录进度，让任何人都看得到完成了什么。支持要配合对方的成熟度：新手需要明确指示，进步中的人需要辅导，能干的人需要信任。食品安全步骤从第一天起就没有商量余地。"],"example":["Teach a new FOH staff to open the display: Tell (why a full display sells), Show (set it up in 10 minutes), Do (they set it while you watch), Review (SBI: you faced items well, the price tags were off; fix and do it again tomorrow).","教新的 FOH 员工开陈列：讲（为什么陈列饱满好卖）、示范（10 分钟摆好）、做（他自己摆你观察）、检讨（SBI：商品前推做得好，价格标签有错；改正并明天再做一次）。"],"sc":{"q":["A new staff member watched you make a sandwich once and now does it alone. Two customers waited long and one filling was wrong. What next?","新员工看你做过一次三明治后就独自做，两位顾客等很久，还有一个馅料放错。接下来怎么做？"],"o":[{"t":["Go back to the four steps: show again, let him do it with you watching, then review with SBI and track it on the checklist","回到四步：再示范、让他在你旁观下做、用 SBI 检讨，并记在清单上"],"ok":1,"w":["Skills come from guided practice and feedback, not one demo.","技能来自有指导的练习与反馈，不是一次示范。"]},{"t":["Let him learn by trying on customers","让他在顾客身上边试边学"],"ok":0,"w":["It puts the customer experience and safety at risk.","会让顾客体验和安全冒风险。"]},{"t":["Tell him he is too slow and not suitable","说他太慢、不适合"],"ok":0,"w":["Judging the person ignores that the training skipped steps.","评判人，却忽略了培训跳过了步骤。"]}]},"quiz":[{"q":["What are the four OJT steps?","OJT 的四步是什么？"],"o":[["Hire, fire, rehire, retire","聘、解、再聘、退"],["Plan, bake, sell, count","计划、烘焙、销售、盘点"],["Tell, show, let them do, review","讲、示范、让他做、检讨"]],"a":2,"w":["Guided practice beats one demo.","有指导的练习胜过一次示范。"]},{"q":["How do you check understanding?","怎样确认对方理解？"],"o":[["Ask them to explain it back","请他复述"],["Ask, Do you understand?","问：你懂了吗？"],["Assume yes","当作懂了"]],"a":0,"w":["Explaining back shows real understanding.","复述才看得出真懂。"]},{"q":["Why use a checklist?","为什么用清单？"],"o":[["It is paperwork","只是文书"],["Anyone can see progress","任何人都看得到进度"],["To punish","惩罚"]],"a":1,"w":["Shared record of what is done.","共享的完成记录。"]},{"q":["A beginner needs mostly:","新手主要需要："],"o":[["Total freedom","完全自由"],["No supervision","不要监督"],["Clear instructions","明确的指示"]],"a":2,"w":["Match support to readiness.","支持配合成熟度。"]},{"q":["Food safety steps during OJT are:","OJT 期间的食品安全步骤是："],"o":[["Non-negotiable from day one","从第一天起不能商量"],["Taught later","以后再教"],["Optional","可选"]],"a":0,"w":["Safety does not wait.","安全不能等。"]}],"task":["Pick one OJT staff and one skill. Break it into 4 to 6 checklist steps, run Tell-Show-Do-Review, and record the progress. Write one SBI feedback you gave.","选一位 OJT 员工和一项技能。拆成 4 到 6 个清单步骤，做讲-示范-做-检讨，并记录进度。写下你给的一次 SBI 反馈。"],"src":[["University of Calgary: SBI model in one-on-one meetings","https://www.ucalgary.ca/hr/training-development/connect-perform/one-one-meetings/sbi-model"]]}]};
