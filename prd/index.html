function mk(pre,ins,outs,note){
 var html='<div class="hr hr6" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'+ins.map(function(f,i){return '<div><label>'+f[0]+' / '+f[1]+'</label><input type="number" min="0" step="any" id="'+pre+i+'" value="'+f[2]+'"></div>';}).join('')+'</div>'
 +'<div class="err" id="'+pre+'e">Enter numbers of 0 or more. 请输入大于或等于0的数字。</div>'
 +'<div class="kpi">'+outs.map(function(o,j){return '<div><span class="note">'+o[0]+' / '+o[1]+'</span><b id="'+pre+'o'+j+'"></b></div>';}).join('')+'</div>'
 +(note?'<p class="note">'+note+'</p>':'');
 return {html:html,init:function(){
  function upd(){
   var v=[],bad=false,i;
   for(i=0;i<ins.length;i++){var r=document.getElementById(pre+i).value.trim();if(r===''||isNaN(+r)||+r<0)bad=true;v.push(+r);}
   var e=document.getElementById(pre+'e');
   if(bad){e.style.display='block';return;}
   e.style.display='none';
   outs.forEach(function(o,j){document.getElementById(pre+'o'+j).textContent=o[2](v);});
  }
  document.getElementById('tool').addEventListener('input',upd);upd();}};
}

window.COURSE={"id":"prd","en":"Product, display, service and food safety","zh":"产品、陈列、服务与食品安全","intro":["Six short units for store teams. You learn the four main food safety risks, temperature control, cross-contamination, allergens and grooming, product freshness, display, and how to handle a customer complaint. The food safety units follow public SFA guidance. Always check with your company SOP and your Food Hygiene Officer, because rules and your licence conditions come first.","给门店团队的 6 个短单元：食品安全四大风险、温度控制、交叉污染、过敏原与仪容、产品新鲜度、陈列，以及如何处理顾客投诉。食品安全部分依据新加坡食品局（SFA）的公开指引。请务必以公司 SOP 和你们的食品卫生主任（FHO）为准，法规和牌照条件优先。"],"units":[
{"id":"p1","en":"Food safety basics: the four risks","zh":"食品安全基础：四大风险","lesson":["SFA analysed past foodborne disease outbreaks and found four leading risk factors: poor food handler or premises hygiene, improper temperature control, undercooked food, and cross-contamination. In a bakery, fillings such as cream, custard, egg and meat are the high-risk items. In Singapore, food handlers must have a valid WSQ Food Safety Course Level 1 and be registered with SFA, and licensees must not let untrained people (for example cashiers who are not qualified) help with food preparation. SFA also reminds operators that food handlers must not prepare food when unwell.","SFA 分析过去的食源性疾病爆发，找出四大风险：食品从业员或场所卫生不佳、温度控制不当、食物没煮熟、交叉污染。在烘焙店，奶油、卡士达、蛋和肉类馅料是高风险品项。在新加坡，食品从业员必须持有有效的 WSQ 食品安全课程第一级（FSC Level 1）并向 SFA 注册，持牌人不得让未受训的人（例如未取得资格的收银员）协助备餐。SFA 也提醒，食品从业员身体不适时不得处理食物。"],"example":["A new part-timer starts Monday and has not done FSC Level 1. Until he is trained and registered, keep him on tasks that do not involve preparing food, and ask your Food Hygiene Officer what he may do.","新来的兼职员工周一上班，还没上 FSC Level 1。在他受训并注册之前，只能做不涉及备餐的工作，并请教你们的食品卫生主任他可以做什么。"],"sc":{"q":["A staff member says he has diarrhoea but the store is short of people today. He offers to work the bake counter. What do you do?","一位员工说自己拉肚子，但今天人手不够，他愿意站面包柜台。你怎么做？"],"o":[{"t":["Ask him to wash his hands more often","叫他多洗手"],"ok":0,"w":["Handwashing helps, but it does not remove the risk from an unwell handler.","洗手有帮助，但消除不了生病员工带来的风险。"]},{"t":["Let him work, but wear gloves","让他上班，但戴手套"],"ok":0,"w":["Gloves do not make an unwell handler safe. SFA says food handlers must not prepare food when unwell.","戴手套并不能让生病的员工变安全。SFA 要求食品从业员不适时不得处理食物。"]},{"t":["Send him home or off food duty, then follow the sickness reporting rule and rearrange the roster","让他回家或不碰食物，按病假与上报规定处理，并重新安排排班"],"ok":1,"w":["Protect the customers first. Fix the roster separately, for example by calling a standby or moving breaks.","先保护顾客。人手问题另外解决，例如叫候补或调整休息时间。"]}]},"quiz":[{"q":["Which is one of the four leading risk factors in SFA analysis?","哪一项是 SFA 分析的四大风险之一？"],"o":[["Cross-contamination","交叉污染"],["Rent too high","租金太高"],["Slow service","服务太慢"]],"a":0,"w":["The four are hygiene, temperature control, undercooked food and cross-contamination.","四项是：卫生、温度控制、没煮熟、交叉污染。"]},{"q":["What certificate must a food handler hold in Singapore?","新加坡的食品从业员必须持有什么证书？"],"o":[["A degree","学位"],["WSQ Food Safety Course Level 1","WSQ 食品安全课程第一级"],["No certificate needed","不需要证书"]],"a":1,"w":["Food handlers need WSQ FSC Level 1 and must be registered with SFA.","食品从业员需要 FSC Level 1，并向 SFA 注册。"]},{"q":["Can an untrained cashier help prepare food?","未受训的收银员可以协助备餐吗？"],"o":[["No, licensees must not allow untrained people to help with preparation","不可以，持牌人不得让未受训的人协助备餐"],["Only on weekends","只在周末可以"],["Yes, if busy","忙的时候可以"]],"a":0,"w":["SFA states untrained people must not assist with food preparation.","SFA 规定未受训的人不得协助备餐。"]},{"q":["A handler is unwell. What is the right action?","有员工身体不适，正确做法是什么？"],"o":[["Keep working with a mask","戴口罩继续做"],["Take him off food handling","让他离开食物处理工作"],["Ignore it","不理会"]],"a":1,"w":["Unwell handlers must not prepare food.","生病的员工不得处理食物。"]},{"q":["Which bakery items are usually the highest risk?","烘焙店哪些品项通常风险最高？"],"o":[["Plain bread crust","纯面包外皮"],["Cream, custard, egg and meat fillings","奶油、卡士达、蛋和肉类馅料"],["Dry cookies in sealed packs","密封包装的干饼干"]],"a":1,"w":["Moist, protein-rich fillings let bacteria grow fast.","湿润、高蛋白的馅料让细菌生长很快。"]}],"task":["Check your store: list every food handler on the roster and mark whether each has a valid FSC Level 1 and is registered. Write down any gap and who will fix it.","检查门店：列出排班表上所有食品从业员，标出每人是否持有有效 FSC Level 1 并已注册。写下缺口和负责补上的人。"],"src":[["SFA: Food safety (four leading risk factors)","https://www.sfa.gov.sg/food-for-thought/article/detail/a-recipe-to-ensure-safe-food-for-all"],["SFA: Requirements for Food Handlers","https://www.sfa.gov.sg/food-handler-hygiene-officer/requirements-for-food-handler-hygiene-officer"],["SFA: Advisory on good food safety and personal hygiene practices (Dec 2024)","https://www.sfa.gov.sg/docs/default-source/circulars/others/2024/advisory-on-food-safety-practices-for-food-establishments_dec-24.pdf"]]},
{"id":"p2","en":"Temperature control: the danger zone","zh":"温度控制：危险温度区间","lesson":["Bacteria multiply fastest between 5°C and 60°C, which SFA calls the temperature danger zone. Keep cold food cold and hot food hot. SFA advises not to keep cooked or ready-to-eat food in the danger zone for more than four hours, and to discard it if it has been. Fridges and freezers keep food below 5°C. SFA warehousing guidance asks for chilled food at 4°C or below. Singapore is warm, so the clock runs faster in a busy shop: take only what you need out of the chiller, keep a time record for items on display, and check the chiller temperature at the start and during the day.","细菌在 5°C 到 60°C 之间繁殖最快，SFA 称之为温度危险区间。冷的要保持冷，热的要保持热。SFA 建议，煮熟或即食食物在危险区间不得超过四小时，超过就要丢弃。冰箱和冷冻库把食物保持在 5°C 以下；SFA 仓储指引要求冷藏食品保持在 4°C 或以下。新加坡天气热，繁忙的门店里时间过得更快：只从冷柜拿出需要的量，给陈列品记录开始时间，并在开店和营业中检查冷柜温度。"],"example":["A cream cake has been on the open counter for 2.5 hours. Time left under the 4-hour rule: 1.5 hours. At 4 hours it must be discarded and recorded as waste with the reason.","一个奶油蛋糕已在开放柜台放了 2.5 小时。按 4 小时规则还剩 1.5 小时。到 4 小时就必须丢弃，并在损耗记录写明原因。"],"tool":{"kind":"p2"},"sc":{"q":["At 3pm you find a tray of custard tarts that came out of the chiller at 10:30am and has been on display since. There is no time label. What do you do?","下午 3 点你发现一盘卡士达塔，早上 10:30 从冷柜拿出来陈列，没有时间标签。你怎么做？"],"o":[{"t":["Keep selling, they look fine","继续卖，看起来没问题"],"ok":0,"w":["Looks and smell do not show bacteria. 4.5 hours in the danger zone is beyond the limit.","外观和气味看不出细菌。4.5 小时已超过限制。"]},{"t":["Discard them, record the waste with the reason, and add time labels to every display tray","丢弃，记录损耗和原因，并给每个陈列盘加上时间标签"],"ok":1,"w":["Over 4 hours means discard. A time label would have made this easy to see and avoid.","超过 4 小时就要丢弃。时间标签可以让这一点一目了然，也能避免问题。"]},{"t":["Put them back in the chiller and sell tomorrow","放回冷柜明天再卖"],"ok":0,"w":["Cooling does not reset the time already spent in the danger zone.","再冷藏也无法抵消已经在危险区间的时间。"]}]},"quiz":[{"q":["What is the temperature danger zone?","温度危险区间是多少？"],"o":[["60°C to 100°C","60°C 到 100°C"],["5°C to 60°C","5°C 到 60°C"],["0°C to 20°C","0°C 到 20°C"]],"a":1,"w":["Bacteria multiply most rapidly there.","细菌在这个区间繁殖最快。"]},{"q":["How long can cooked or ready-to-eat food stay in the danger zone (SFA advice)?","煮熟或即食食物在危险区间最多多久（SFA 建议）？"],"o":[["Up to 12 hours","最多 12 小时"],["Until it looks bad","直到看起来变坏"],["No more than 4 hours","不超过 4 小时"]],"a":2,"w":["Discard anything left beyond 4 hours.","超过 4 小时就要丢弃。"]},{"q":["A tray has been out 3.5 hours. How many hours are left?","一盘已放 3.5 小时，还剩多少小时？"],"o":[["0.5 hours","0.5 小时"],["1.5 hours","1.5 小时"],["4 hours","4 小时"]],"a":0,"w":["4 − 3.5 = 0.5.","4 − 3.5 = 0.5。"]},{"q":["Does putting food back in the chiller reset the clock?","放回冷柜会重新计时吗？"],"o":[["Only for cakes","只有蛋糕会"],["Yes","会"],["No, time already spent in the danger zone counts","不会，已在危险区间的时间照算"]],"a":2,"w":["The bacteria already grew.","细菌已经生长了。"]},{"q":["What should chilled food temperature be (SFA warehousing guidance)?","冷藏食品的温度应是多少（SFA 仓储指引）？"],"o":[["10°C","10°C"],["20°C","20°C"],["4°C or below","4°C 或以下"]],"a":2,"w":["Keep the cold chain unbroken.","不要中断冷链。"]}],"task":["Take the temperature of every chiller and showcase now and again before closing. Write each reading and check that every display tray has a time label. Fix one gap.","现在以及打烊前各量一次所有冷柜和展示柜的温度，写下读数，并检查每个陈列盘是否有时间标签。改善一处缺口。"],"src":[["SFA: Safe food practices (temperature danger zone)","https://www.sfa.gov.sg/food-safety-tips/safe-food-practices"],["SFA: Food safety (four leading risk factors)","https://www.sfa.gov.sg/food-for-thought/article/detail/a-recipe-to-ensure-safe-food-for-all"],["SFA: Good warehousing practices (cold chain)","https://sfa.gov.sg/docs/default-source/food-manufacturing-and-storage/goodwarehousingpractices.pdf"]]},
{"id":"p3","en":"Cross-contamination, cleaning, allergens and grooming","zh":"交叉污染、清洁、过敏原与仪容","lesson":["Cross-contamination is when germs or allergens move from one food, surface, hand or tool to another. Prevent it with separate boards, knives and tongs for raw and ready-to-eat food, clean and sanitise surfaces between tasks, and wash hands properly at the right moments: after the toilet, after touching raw food, bins, money or phones, and before handling ready-to-eat food. Use SFA handwashing steps. Allergens are a separate risk: common ones include eggs, milk, wheat, nuts, soy and sesame. Know what is in each product, label it, and never guess when a customer asks. If you are not sure, say so and check with the kitchen or your manager. Follow your company allergen information. Grooming is part of the same barrier. When preparing, handling or displaying food, wear no jewellery or accessories: no rings, bracelets, watches, earrings, necklaces or piercings you cannot cover, and no false nails, nail polish, false eyelashes or strong perfume. Keep nails short and clean, tie hair back or cover it, and wear clean uniform and apron. Why: jewellery and watches collect and spread dirt and bacteria, they can fall into the food, and they stop hands from being washed properly; nail polish and false nails can chip into food; strong perfume can taint food. Public guidance from the UK, Hong Kong and others follows this. Some say a plain wedding band is allowed, but follow your company grooming standard.","交叉污染是指细菌或过敏原从一种食物、表面、手或工具转移到另一种。预防方法：生食与即食食物分开使用砧板、刀和夹子；换工作时清洁并消毒表面；在对的时机正确洗手：上厕所后、接触生食、垃圾桶、钱或手机后，以及处理即食食物前。洗手步骤依照 SFA 指引。过敏原是另一类风险：常见的有蛋、奶、小麦、坚果、大豆和芝麻。要知道每个产品含什么、做好标示，顾客询问时绝不能猜。不确定就如实说，并向厨房或经理确认。请遵守公司的过敏原资料。仪容也是同一道屏障。备餐、处理或陈列食物时，不戴任何首饰或配饰：不戴戒指、手链、手表、耳环、项链，遮不住的穿孔饰品也不行；不戴假指甲、不涂指甲油、不戴假睫毛、不喷浓香水。指甲要短而干净，头发扎好或戴发帽，穿干净的制服和围裙。原因：首饰和手表会积聚并传播污垢和细菌，可能掉进食物，还会让手洗不干净；指甲油和假指甲可能碎进食物；浓香水会让食物沾上异味。英国、香港等地的公开指引都是这样要求。有些指引允许戴素面婚戒，请以公司的仪容标准为准。"],"example":["Staff touch a till and a phone, then pick up a croissant with bare hands. Two moments to wash hands were missed, and the pastry is now a cross-contamination risk. Use tongs or gloves and wash hands after the till and phone. Grooming check at the start of a shift: ring on, watch on, nail polish chipped. Remove the ring and watch and store them in your locker, and do not handle food until the polish is removed or you are moved to non-food work.","员工摸过收银机和手机，再用手直接拿可颂。错过了两次洗手时机，这个可颂有交叉污染的风险。应使用夹子或手套，并在碰收银机和手机后洗手。班前仪容检查：戴着戒指和手表，指甲油已剥落。把戒指和手表取下放进储物柜；指甲油没卸掉之前不要碰食物，或先调去不接触食物的工作。"],"sc":{"q":["A customer with a nut allergy asks if the green tea cookie has nuts. You are not sure. What do you say?","一位对坚果过敏的顾客问抹茶饼干有没有坚果，你不确定。你怎么说？"],"o":[{"t":["I am not sure. Let me check the ingredient information with my manager before you decide","我不确定，让我先跟经理核对成分资料，您再决定"],"ok":1,"w":["Honest checking protects the customer. Never guess.","诚实地核对才能保护顾客，绝不能猜。"]},{"t":["Tell them to read the label themselves","叫他自己看标签"],"ok":0,"w":["Help the customer and check the information. Do not push the risk back to them.","要帮助顾客并核对资料，不能把风险推回给顾客。"]},{"t":["No, I think it is fine","没有，我觉得没问题"],"ok":0,"w":["Guessing about an allergen can cause serious harm.","对过敏原猜测可能造成严重伤害。"]}]},"quiz":[{"q":["What is cross-contamination?","什么是交叉污染？"],"o":[["Mixing two doughs","把两种面团混合"],["Over-baking","烤过头"],["Germs or allergens moving from one item to another","细菌或过敏原从一样东西转移到另一样"]],"a":2,"w":["It can come from hands, surfaces, tools or other food.","可能来自手、表面、工具或其他食物。"]},{"q":["When must hands be washed?","什么时候必须洗手？"],"o":[["After toilet, raw food, bins, money or phones, and before ready-to-eat food","上厕所、接触生食、垃圾桶、钱或手机之后，以及处理即食食物之前"],["Once at the start of shift","只在上班开始时一次"],["Only when visibly dirty","只有看得见脏时"]],"a":0,"w":["Hands pick up germs between tasks.","手在不同工作之间会沾上细菌。"]},{"q":["Which are common allergens?","哪些是常见过敏原？"],"o":[["Water","水"],["Eggs, milk, wheat, nuts, soy, sesame","蛋、奶、小麦、坚果、大豆、芝麻"],["Salt and sugar","盐和糖"]],"a":1,"w":["Know which products contain them.","要知道哪些产品含有它们。"]},{"q":["A customer asks about an ingredient you do not know. You should:","顾客问到你不知道的成分，你应该："],"o":[["Say you are not sure and check","说不确定并去核对"],["Say it is safe","说是安全的"],["Guess","猜"]],"a":0,"w":["Never guess about allergens.","过敏原绝不能猜。"]},{"q":["How do you prevent raw to ready-to-eat contamination?","怎样防止生食污染即食食物？"],"o":[["Separate boards and tools, clean and sanitise","分开砧板和工具，并清洁消毒"],["Use one board for everything","所有东西用同一块砧板"],["Rinse with water only","只用水冲"]],"a":0,"w":["Separation is the simplest barrier.","分开使用是最简单的屏障。"]},{"q":["Which of these should NOT be worn when handling food?","处理食物时，下列哪项不应该戴？"],"o":[["Plain clean uniform","干净的制服"],["Rings, bracelets and watches","戒指、手链和手表"],["Hair tied back","把头发扎好"]],"a":1,"w":["Jewellery and watches collect dirt and bacteria, can fall into food, and block proper handwashing.","首饰和手表会积聚污垢和细菌，可能掉进食物，也让手洗不干净。"]},{"q":["Why are nail polish and false nails not allowed?","为什么不允许涂指甲油和戴假指甲？"],"o":[["They look unprofessional only","只是看起来不专业"],["They can chip off into food and hide dirt","可能碎进食物并藏污垢"],["They make hands warmer","让手更暖"]],"a":1,"w":["Chips are a physical contamination risk and the surface can hide germs.","碎片是物理性污染风险，表面也能藏细菌。"]},{"q":["Your colleague arrives wearing a watch and earrings and starts at the bake counter. What do you do?","同事戴着手表和耳环来上班，直接站烘焙柜台。你怎么做？"],"o":[["Say nothing, they are busy","没关系，他很忙就不说"],["Remind them privately and kindly to remove them and store them in the locker before handling food","私下友善提醒，处理食物前把它们取下放进储物柜"],["Tell them off in front of customers","在顾客面前责备他"]],"a":1,"w":["Correct it at once, privately and respectfully. Food safety standards apply to everyone.","立即、私下且尊重地纠正。食品安全标准适用于所有人。"]}],"task":["Watch hand-washing moments for 30 minutes at the counter. Count the missed moments, show the team the SFA steps, and agree one habit to change. Also do a grooming check with your team before the shift: jewellery and watches off, nails short and clean without polish, hair tied or covered, clean uniform. Note anything you fixed.","在柜台观察 30 分钟的洗手时机，数一数漏掉几次，向团队示范 SFA 洗手步骤，并约定改变一个习惯。同时在班前和团队做一次仪容检查：首饰和手表取下、指甲短而干净且不涂指甲油、头发扎好或戴帽、制服干净。记下你纠正了什么。"],"src":[["SFA: Hand hygiene in food handling","https://sfa.gov.sg/food-information/risk-at-a-glance/hand-hygiene-in-food-handling"],["SFA: Food safety (four leading risk factors)","https://www.sfa.gov.sg/food-for-thought/article/detail/a-recipe-to-ensure-safe-food-for-all"],["SFA: Advisory on good food safety and personal hygiene practices (Dec 2024)","https://www.sfa.gov.sg/docs/default-source/circulars/others/2024/advisory-on-food-safety-practices-for-food-establishments_dec-24.pdf"],["Hong Kong CFS: clothing and jewellery","https://www.cfs.gov.hk/english/trade_zone/safe_kitchen/files/clothing.pdf"],["UK FSA: personal hygiene and fitness to work","https://www.food.gov.uk/sites/default/files/media/document/personal-hygiene-fitness-to-work.pdf"],["University of Cambridge catering: personal hygiene requirements","https://www.catering.admin.cam.ac.uk/sites/default/files/8_-_personal_hygiene_requirements_-_web_version_-_apr19_0.pdf"],["SFA: hygiene guidelines for service staff","https://www.SFA.gov.sg/docs/default-source/our-services/guidelines-on-good-hygiene-practices-by-service-staff-at-food-establishments_070319.pdf"]]},
{"id":"p4","en":"Product quality and freshness","zh":"产品品质与新鲜度","lesson":["Quality is what the customer sees, smells and tastes, and it is also a safety issue. Use FIFO, label each batch with the bake or receive time, and follow the shelf-life rule for each product. Check the display at opening and at fixed times: appearance, smell, texture and temperature. Remove anything past its time or quality standard, and record the item, quantity and reason at once so the waste number stays true. Do not extend shelf life to save cost, and do not cut the display below standard to hit a waste target. If a customer reports a problem, keep the item if possible and tell your manager.","品质是顾客看到、闻到、尝到的，也是安全问题。使用先进先出，每一批标示烘焙或收货时间，遵守每个产品的保质规定。开店时和固定时间检查陈列：外观、气味、质地和温度。超过时间或不符品质标准的就撤下，并立即记录品项、数量和原因，让损耗数字保持真实。不能为了省成本延长保质期，也不能为了损耗目标把陈列减到标准以下。顾客反映问题时，尽可能保留该商品并通知经理。"],"example":["Quality walk at 11am: 20 items checked, 2 with flattened tops and 1 past its time label. Remove the 3, record them, and ask BOH to adjust the next bake. Pass rate = 17 ÷ 20 = 85%.","上午 11 点品质巡查：检查 20 个品项，2 个顶部塌陷，1 个已过时间标签。撤下这 3 个并记录，请 BOH 调整下一批烘焙。合格率 = 17 ÷ 20 = 85%。"],"sc":{"q":["Closing time is near and one tray of bread is just past its time label but still looks fine. The waste target for the day is tight. What do you do?","快打烊了，一盘面包刚过时间标签但看起来没问题，而今天的损耗目标很紧。你怎么做？"],"o":[{"t":["Change the label time","改标签上的时间"],"ok":0,"w":["Changing labels is dishonest and unsafe.","改标签是不诚实也不安全的。"]},{"t":["Sell it with a discount tonight","今晚打折卖掉"],"ok":0,"w":["Selling past the shelf-life rule is a quality and safety risk, no matter how it looks.","超过保质规定还卖，不管外观如何，都有品质与安全风险。"]},{"t":["Remove it, record it as waste with the reason, and tell BOH so the plan can be adjusted","撤下并记录损耗和原因，告诉 BOH 以调整生产计划"],"ok":1,"w":["Safety and quality come before the number. The record helps fix the plan.","安全与品质优先于数字。记录能帮助改进计划。"]}]},"quiz":[{"q":["What do you use to rotate stock?","用什么方法轮替库存？"],"o":[["FIFO","先进先出"],["LIFO","后进先出"],["Random","随便"]],"a":0,"w":["Oldest first.","最旧的先用。"]},{"q":["What goes on each batch label?","每批标签要写什么？"],"o":[["Nothing","什么都不写"],["Bake or receive time","烘焙或收货时间"],["Staff name only","只写员工名字"]],"a":1,"w":["It lets anyone see how old it is.","让任何人都看得出它有多久。"]},{"q":["20 items checked, 3 fail. What is the pass rate?","检查 20 个，3 个不合格，合格率多少？"],"o":[["15%","15%"],["17%","17%"],["85%","85%"]],"a":2,"w":["17 ÷ 20 = 85%.","17 ÷ 20 = 85%。"]},{"q":["Can you extend shelf life to reduce waste?","可以延长保质期来减少损耗吗？"],"o":[["Yes","可以"],["No, never against the rule","不可以，绝不违反规定"],["Only on Fridays","只有周五可以"]],"a":1,"w":["Safety first.","安全第一。"]},{"q":["What should you record when discarding?","丢弃时要记录什么？"],"o":[["Only the cost","只记金额"],["Item, quantity, reason","品项、数量、原因"],["Nothing if small","小的不用记"]],"a":1,"w":["Immediate and complete records keep waste numbers true.","当场且完整的记录让损耗数字真实。"]}],"task":["Do a quality walk of the whole display three times today (open, lunch, afternoon). Count the items checked and the pass rate. Write one cause for the fails.","今天对整个陈列做三次品质巡查（开店、午市、下午）。数一数检查数量和合格率，并写下不合格的一个原因。"],"src":[["SFA: Safe food practices (temperature danger zone)","https://www.sfa.gov.sg/food-safety-tips/safe-food-practices"],["SFA: Advisory on good food safety and personal hygiene practices (Dec 2024)","https://www.sfa.gov.sg/docs/default-source/circulars/others/2024/advisory-on-food-safety-practices-for-food-establishments_dec-24.pdf"]]},
{"id":"p5","en":"Display and merchandising","zh":"陈列与商品展示","lesson":["People buy bakery with their eyes. Practical rules from bakery and retail sources: keep the display full and abundant at peak, because a few items left look old and unwanted. Put the freshest, most attractive and higher-margin items at eye level, because goods at eye level get more attention and goods below waist level are often overlooked. Keep glass and counters clean, lighting good, and prices and names clear and correct on every item. Rotate and refresh the display so it does not get boring, and cross-merchandise items that go together. Do not merchandise beyond demand: a display that is full but over-produced creates waste. Link it to the production plan and bake waves.","顾客是用眼睛买面包的。来自烘焙与零售资料的实用规则：高峰时陈列要饱满丰富，因为只剩几个会显得旧而没人要。把最新鲜、最吸引人、毛利较高的品项放在视线高度，因为视线高度的商品更受注意，腰部以下常被忽略。保持玻璃和柜台干净、灯光良好，每个品项的名称和价格清楚且正确。轮换更新陈列避免单调，并把搭配的商品放在一起。不要超过需求陈列：陈列满但生产过量会造成损耗。要与生产计划和烘焙批次配合。"],"example":["At 11:30 the lunch peak starts. A full display of the top 5 items at eye level, with correct price tags, sells more than a half-empty one. If the best seller is placed at the bottom shelf, move it up and watch the sales for the next three days.","11:30 午市高峰开始。前 5 名畅销品放在视线高度、陈列饱满、价格标签正确，比半空的陈列卖得更好。如果畅销品放在最下层，把它移上来，观察接下来三天的销售。"],"sc":{"q":["It is 5pm, the evening peak is coming, and the display is thin. BOH says the next batch comes out at 5:30. What do you do?","下午 5 点，傍晚高峰快到，陈列偏少。BOH 说下一批 5:30 出炉。你怎么做？"],"o":[{"t":["Wait for the batch, customers will understand","等新一批出炉，顾客会理解"],"ok":0,"w":["The peak starts before the bake. Customers see a thin display and leave.","高峰比出炉早开始，顾客看到陈列少就走了。"]},{"t":["Rearrange and face the remaining items to look full, tidy the signs, and ask BOH to plan the wave earlier next time","重新整理并把剩余品项前推，让陈列看起来饱满，整理标示，并请 BOH 下次把批次提早"],"ok":1,"w":["Fix the display now and fix the plan so the wave lands before the peak.","现在先整理陈列，再调整计划，让批次在高峰前完成。"]},{"t":["Fill the display with slow sellers","用慢销品把陈列填满"],"ok":0,"w":["That creates waste and hides the products customers want.","这会造成损耗，还把顾客想要的商品藏起来了。"]}]},"quiz":[{"q":["Where should the best items go?","最好的品项该放哪里？"],"o":[["Behind the counter","柜台后面"],["At eye level","视线高度"],["On the floor","地上"]],"a":1,"w":["Eye level gets the most attention.","视线高度最受注意。"]},{"q":["Why keep the display full at peak?","为什么高峰要保持陈列饱满？"],"o":[["It is the rule only","只是规定"],["It saves cost","能省钱"],["A few left look old and unwanted","只剩几个会显得旧、没人要"]],"a":2,"w":["Fullness signals freshness and choice.","饱满代表新鲜和有得选。"]},{"q":["What must be on every item?","每个品项必须有什么？"],"o":[["Clear and correct name and price","清楚且正确的名称和价格"],["Nothing","什么都不用"],["Only a sticker","只有贴纸"]],"a":0,"w":["Customers must know what it is and what it costs.","顾客必须知道是什么、多少钱。"]},{"q":["What is the risk of an over-full display?","陈列过满的风险是什么？"],"o":[["None","没有"],["Waste","损耗"],["Higher sales always","销售一定更高"]],"a":1,"w":["Display beyond demand ends up unsold.","超过需求的陈列最后卖不掉。"]},{"q":["What is cross-merchandising?","什么是搭配陈列？"],"o":[["Moving everything daily","每天全部换位置"],["Hiding prices","隐藏价格"],["Placing items that go together near each other","把搭配的商品放在一起"]],"a":2,"w":["It encourages add-on sales.","能鼓励加购。"]}],"task":["Photograph the display at opening, at the lunch peak and at the evening peak. Mark one gap (thin, wrong shelf, wrong price) in each photo and write the fix.","在开店、午市高峰和傍晚高峰各拍一张陈列照片，每张标出一处问题（偏少、放错层、价格错），并写下改善方法。"],"src":[["Bakers Journal: nine tips for bakery presentation","https://www.bakersjournal.com/concepts-for-success-3725/"],["CSP: how to build and maintain the optimal bakery case","https://www.cspdailynews.com/foodservice/how-build-maintain-optimal-bakery-case-solution"],["Penn State Extension: merchandise presentation","https://extension.psu.edu/merchandise-presentation-for-agricultural-businesses"]]},
{"id":"p6","en":"Service and handling complaints","zh":"服务与处理投诉","lesson":["Good service is greet, serve quickly, serve accurately, and thank. When something goes wrong, use a simple recovery routine: Listen without interrupting, Apologise sincerely, Solve the problem within what you are allowed to do, and Thank the customer for telling you. Do not argue, and do not blame the team or the kitchen in front of the customer. Check the customer is satisfied. Record the complaint so patterns show. Food safety complaints (a foreign object, a customer feeling unwell, a suspected allergy reaction) go to the manager at once: keep the item if possible, record details, and follow the company procedure.","好的服务是：问候、快速、准确、道谢。出了问题，用简单的补救流程：专心聆听不打断、真诚道歉、在权限内解决问题、感谢顾客提出。不要争辩，也不要在顾客面前怪团队或厨房。确认顾客满意。记录投诉，才看得出规律。食品安全类的投诉（异物、顾客不适、疑似过敏反应）要立即通知经理：尽可能保留该商品，记录详情，并依公司程序处理。"],"example":["A customer says the croissant was stale. Listen (let her finish), apologise (I am sorry it was not fresh), solve (offer a replacement or refund within your limit), thank (thank you for telling us), then record the item, time and likely cause for BOH.","顾客说可颂不新鲜。聆听（让她说完）、道歉（很抱歉不新鲜）、解决（在权限内换新或退款）、道谢（谢谢您告诉我们），然后记录品项、时间和可能原因给 BOH。"],"sc":{"q":["A customer finds a hair in a pastry and is upset. What do you do first?","顾客在点心里发现一根头发，很生气。你首先做什么？"],"o":[{"t":["Listen, apologise sincerely, offer a replacement or refund, keep the item, tell your manager and record it","聆听、真诚道歉、提供换新或退款，保留该商品，通知经理并记录"],"ok":1,"w":["This follows listen, apologise, solve, thank, and treats it as a food safety report.","这符合聆听、道歉、解决、道谢的流程，并当作食品安全事件处理。"]},{"t":["Take it away quickly and say nothing","赶快拿走什么都不说"],"ok":0,"w":["Hiding it loses the customer and the chance to find the cause.","隐瞒会失去顾客，也失去找出原因的机会。"]},{"t":["Explain that it cannot be from us","解释说不可能是我们的"],"ok":0,"w":["Arguing makes it worse and ignores a food safety complaint.","争辩只会更糟，也无视了食品安全投诉。"]}]},"quiz":[{"q":["What is the first step when a customer complains?","顾客投诉时第一步是什么？"],"o":[["Explain the policy","解释规定"],["Argue the facts","辩论事实"],["Listen without interrupting","专心聆听不打断"]],"a":2,"w":["People first need to feel heard.","人们首先需要被听见。"]},{"q":["What do the four steps stand for here?","这四步是什么？"],"o":[["Listen, apologise, solve, thank","聆听、道歉、解决、道谢"],["Ignore, explain, refuse, close","忽略、解释、拒绝、结束"],["Sell, upsell, close, leave","推销、加购、成交、离开"]],"a":0,"w":["A simple routine anyone can remember.","人人都记得住的简单流程。"]},{"q":["Should you blame the kitchen in front of the customer?","可以在顾客面前怪厨房吗？"],"o":[["Only if true","只要是真的就可以"],["Yes","可以"],["No","不可以"]],"a":2,"w":["Own the problem as a team.","要作为团队承担问题。"]},{"q":["A customer reports feeling unwell after eating. Who do you tell?","顾客说吃了不舒服，你要通知谁？"],"o":[["Nobody","没人"],["Wait until closing","等打烊后"],["The manager at once","立即通知经理"]],"a":2,"w":["It is a food safety matter. Keep the item and record details.","这是食品安全事件。保留商品并记录详情。"]},{"q":["Why record complaints?","为什么要记录投诉？"],"o":[["Patterns show and fixes follow","才看得出规律并加以改善"],["For punishment","为了惩罚"],["It is optional","可有可无"]],"a":0,"w":["Repeated causes can be fixed at source.","重复出现的原因可以从源头解决。"]}],"task":["Role-play a complaint with a colleague using listen, apologise, solve, thank. Swap roles. Write one phrase you will use and one you will stop using.","与同事角色扮演一次投诉，使用聆听、道歉、解决、道谢，并交换角色。写下一句你会用的话和一句你不再用的话。"],"src":[["ICSC: resolve retail customer complaints in 4 steps","https://www.icsc.com/news-and-views/icsc-exchange/resolve-retail-customer-complaints-in-4-easy-steps"],["UF/IFAS: customer complaint procedure","https://ask.ifas.ufl.edu/hr005"],["EHL: service recovery checklist","https://insights.ehl.edu/resources/all-resources/service-recovery-checklist"]]}]};

window.COURSE.units[1].tool=mk('t',[['Hours in danger zone','在危险区间的小时数',2.5],['Limit hours','上限小时',4]],[['Hours left','还剩小时',function(v){return r1(Math.max(v[1]-v[0],0));}],['Status','状态',function(v){return v[0]>v[1]?'Discard 丢弃':'Within limit 在限内';}]],'Follow the shorter shelf-life rule of your own product SOP if there is one. 若公司对该产品有更短的保质规定，以公司为准。');
